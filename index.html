<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>adeo-chatbot widget demo</title>
<style>
  body{font-family:sans-serif;margin:0;padding:0;min-height:2400px;background:#f5f5f7;}
  header{padding:24px;background:#131517;color:#fff;}
  main{padding:24px;max-width:800px;}
  .totop{position:fixed;right:32px;bottom:32px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:center;z-index:98;}
  @media (max-width:1023px){.totop{right:20px;bottom:20px;width:40px;height:40px;}}
</style>
</head>
<body>
<header><h1>adeo.co.kr (widget demo page)</h1></header>
<main>
  <p>이 페이지는 실제 adeo.co.kr의 .totop(맨위로) 버튼 위치를 재현한 로컬 테스트 페이지입니다.
  스크롤을 내리고 우측 하단을 확인하세요. 챗봇 플로팅 버튼이 맨위로 버튼 바로 위에 떠 있어야 합니다.</p>
  <p>Lorem ipsum content...</p>
</main>
<div class="totop" title="맨위로(mock)">&uarr;</div>

<script src="./adeo-chatbot.js" data-api-url="http://localhost:8787/api/chat" defer></script>
</body>
</html>
